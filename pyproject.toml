[project]
name = "x2llm"
version = "0.3.0"
description = "Read-only x.com (Twitter) API client for LLM agents: library, CLI, and stdio MCP server"
requires-python = ">=3.12"
dependencies = ["click>=8", "httpx>=0.27", "mcp>=2", "platformdirs>=4"]

[project.scripts]
x2llm = "x2llm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x2llm"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
